name: talking-plant-neon
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the Neon DATABASE_URL with sslmode=require}
      DATABASE_REQUIRED: "true"
      PORT: "8000"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
