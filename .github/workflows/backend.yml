name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install -r requirements-vision.txt
      - run: pip install -r requirements-arduino.txt
      - run: ruff check backend shared scripts tests
      - run: ruff format --check backend shared scripts tests
      - run: python -m pytest -q
      - run: python -m scripts.export_contracts && git diff --exit-code -- shared
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - run: pip install --require-hashes -r requirements.txt
      - run: docker compose up -d --build --wait
      - run: python -m scripts.smoke --save-events /tmp/events.json
      - run: docker compose restart backend && docker compose up -d --wait
      - run: python -m scripts.smoke --verify-events /tmp/events.json
      - if: always()
        run: docker compose down
